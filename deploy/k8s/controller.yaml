apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-controller
  namespace: review-system
  labels:
    app: review-controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app: review-controller
  template:
    metadata:
      labels:
        app: review-controller
    spec:
      serviceAccountName: review-controller
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ghcr.io/zetxqx/review-controller:0.1.0
          args:
            - "--listen-addr=:8080"
            - "--sandbox-runner=k8s"
            - "--sandbox-namespace=review-sandbox"
            - "--runtime-class=gvisor"
            - "--adapter-sandbox-url=http://inference-adapter.review-system.svc.cluster.local:8080"
            - "--adapter-internal-url=http://inference-adapter.review-system.svc.cluster.local:9090"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: review-system-secrets
                  key: database_url
            - name: ADAPTER_TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: review-system-secrets
                  key: adapter_token_key
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: review-system-secrets
                  key: github_webhook_secret
            - name: GITHUB_PRIVATE_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: review-system-secrets
                  key: github_private_key_pem
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: review-controller
  namespace: review-system
  labels:
    app: review-controller
spec:
  selector:
    app: review-controller
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
