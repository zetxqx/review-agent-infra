apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-adapter
  namespace: review-system
  labels:
    app: inference-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-adapter
  template:
    metadata:
      labels:
        app: inference-adapter
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adapter
          image: ghcr.io/zetxqx/review-adapter:0.1.0
          args:
            - "--listen-addr=:8080"
            - "--internal-addr=:9090"
            - "--upstream-kind=llmd-gateway"
            - "--objective=code-review-batch"
          ports:
            - name: sandbox-api
              containerPort: 8080
              protocol: TCP
            - name: internal-mgmt
              containerPort: 9090
              protocol: TCP
          env:
            - name: ADAPTER_UPSTREAM_URL
              valueFrom:
                configMapKeyRef:
                  name: review-system-config
                  key: upstream_url
            - name: ADAPTER_UPSTREAM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: review-system-config
                  key: upstream_model
            - name: ADAPTER_TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: review-system-secrets
                  key: adapter_token_key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: inference-adapter
  namespace: review-system
  labels:
    app: inference-adapter
spec:
  selector:
    app: inference-adapter
  ports:
    - name: sandbox-api
      port: 8080
      targetPort: sandbox-api
      protocol: TCP
    - name: internal-mgmt
      port: 9090
      targetPort: internal-mgmt
      protocol: TCP
