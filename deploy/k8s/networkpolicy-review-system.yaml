apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: controller-ingress-policy
  namespace: review-system
spec:
  podSelector:
    matchLabels:
      app: review-controller
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 130.211.0.0/22
        - ipBlock:
            cidr: 35.191.0.0/16
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: review-sandbox
      ports:
        - protocol: TCP
          port: 8081
