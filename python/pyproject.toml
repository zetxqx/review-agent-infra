[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "review-harness-kit"
version = "0.1.0"
description = "In-sandbox Python kit adapting off-the-shelf coding harnesses to review-agent-infra Protobuf contracts."
requires-python = ">=3.12"
dependencies = [
    "protobuf>=5.27",
    "openai>=1.40",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
review-kit = "review_harness_kit.entrypoint:main"

[project.entry-points."review_agent.harness"]
pr-agent = "review_harness_kit.adapters.pr_agent:PRAgentAdapter"
pr_agent = "review_harness_kit.adapters.pr_agent:PRAgentAdapter"
openhands = "review_harness_kit.adapters.openhands:OpenHandsAdapter"
codex = "review_harness_kit.adapters.codex:CodexAdapter"
mini-swe-agent = "review_harness_kit.adapters.mini_swe_agent:MiniSWEAgentAdapter"
mini_swe_agent = "review_harness_kit.adapters.mini_swe_agent:MiniSWEAgentAdapter"
opencode = "review_harness_kit.adapters.opencode:OpenCodeAdapter"
goose = "review_harness_kit.adapters.goose:GooseAdapter"
aider = "review_harness_kit.adapters.aider:AiderAdapter"
command = "review_harness_kit.adapters.command:CommandAdapter"
external-cmd = "review_harness_kit.adapters.command:CommandAdapter"
external_cmd = "review_harness_kit.adapters.command:CommandAdapter"
mock-llm = "review_harness_kit.adapters.command:MockLLMAdapter"
mock_llm = "review_harness_kit.adapters.command:MockLLMAdapter"
single-shot = "review_harness_kit.adapters.command:SingleShotAdapter"
single_shot = "review_harness_kit.adapters.command:SingleShotAdapter"

[tool.hatch.build.targets.wheel]
packages = ["src/review_harness_kit"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/review_harness_kit/gen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
