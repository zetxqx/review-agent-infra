apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-egress-controller-only
  namespace: review-sandbox
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: review-system
          podSelector:
            matchLabels:
              app: review-controller
      ports:
        - protocol: TCP
          port: 8081
