[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "review-agent-infra"
version = "0.1.0"
description = "Self-hosted, pluggable PR review platform for llm-d built around existing agent harnesses."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

# Each deliverable installs only the extra it runs (see docs/design/implementation-plan.md, Section 1.2).
# Console scripts and plugin entry points are added together with the code in milestone M1.
[project.optional-dependencies]
controller = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
    "psycopg[binary,pool]>=3.2",
    "kubernetes>=30.1",
    "githubkit>=0.11",
    "unidiff>=0.7.5",
    "PyJWT>=2.8",
    "httpx>=0.27",
    "prometheus-client>=0.20",
]
adapter = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "PyJWT>=2.8",
    "prometheus-client>=0.20",
]
kit = [
    "openai>=1.40",
    "pyyaml>=6.0",
]
cli = [
    "typer>=0.12",
    "unidiff>=0.7.5",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "import-linter>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/review_agent"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
